# ETF Signal Scanner configuration
# Every value here can be changed without touching code.

# ---------------------------------------------------------------- scheduling
# How often the scan repeats when looped (via `/loop` in Claude Code or
# `scan.py --loop`). Independent of the chart timeframes below.
interval_minutes: 15

# Skip scans outside US regular trading hours (Mon-Fri 09:30-16:00 ET).
# Pass --force to scan anyway. Exchange holidays are not detected.
market_hours_only: true

# Standalone --loop only: start each scan on an interval boundary (+ delay).
align_to_bar_close: true
post_close_delay_seconds: 20

# ---------------------------------------------------------------- data
data:
  source: yfinance       # yfinance (recommended) | yahoo (direct HTTP, often rate-limited) | csv
  # Chart timeframes every ticker is evaluated on. When any of them triggers,
  # the alert shows all of them. 2h / 3h / 4h are built from 1h bars anchored
  # to the 09:30 ET open. Also supported: 1m 2m 5m 15m 30m 1h 1d.
  timeframes: [1h, 2h, 4h, 1d]
  history_range: auto    # auto, or a range like 6mo / 1y / 2y (or {60m: 1y, 1d: 2y})
  include_prepost: false # include pre/post-market candles
  # false = include the still-forming bar, so a 15-minute scan sees the 1h/2h/4h/D
  # bars as they develop (values can change until the bar closes; alerts mark
  # these "live"). true = only completed bars (a daily bar then updates once a day).
  closed_bars_only: false
  csv_dir: ./data        # used only when source: csv  (<TICKER>.csv intraday files)
  # Skip a timeframe whose closes jump more than this between two bars (0.4 = 40%):
  # almost always a stock split the feed hasn't fully adjusted. 0 disables.
  max_bar_change: 0.4
  request_pause_seconds: 0.25

# ---------------------------------------------------------------- indicators
indicators:
  macd:     {fast: 8, slow: 21, signal: 5}
  rsi:      {lengths: [7, 14]}
  stochrsi: {smooth_k: 3, smooth_d: 3, rsi_length: 14, stoch_length: 14}
  bollinger: {length: 20, stddev: 2.0}

# ---------------------------------------------------------------- signal rules
rules:
  # RSI / StochRSI / Bollinger conditions count if they were true on any of the
  # last N bars of that timeframe (oscillators often bounce off extremes a bar
  # or two before MACD turns). Set to 1 to require everything on the latest bar.
  window_bars: 3

  rsi:
    enabled: true
    oversold: 30
    overbought: 70
    require: all         # all = every RSI length must be extreme; any = at least one

  stochrsi:
    enabled: true
    oversold: 30
    overbought: 70
    line: both           # k | d | both

  macd:
    enabled: true
    # "About to cross": histogram (MACD - signal) is on the wrong side of zero
    # but has moved toward zero for `converging_bars` consecutive bars and, at
    # its current slope, reaches zero within `lookahead_bars`.
    converging_bars: 2
    lookahead_bars: 2
    # Also accept a cross that already happened this recently (0 = latest bar).
    max_bars_since_cross: 1

  bollinger:
    enabled: true
    # touch = candle low/high pierces the band (wick counts)
    # close = candle closes outside the band
    # cross = close moves from inside to outside the band on that bar
    mode: touch

  # How many enabled conditions must be met.
  signal_min_conditions: 4   # full confluence -> SIGNAL
  watch_min_conditions: 3    # near-miss -> WATCH (set higher than 4 to disable)

  # A trigger that disappears (e.g. a live bar moving back inside the band) is
  # remembered this long, so if it comes straight back it isn't alerted again.
  clear_after_minutes: 60

# ---------------------------------------------------------------- Slack alerts
# When a timeframe newly triggers at one of `levels`, the scan output includes
# ready-to-send `notify` messages (one per ticker, showing every timeframe) and
# the Claude skill posts them to this channel via the Slack connector.
slack:
  enabled: true
  channel_id: C0CF5LJJTTP            # #etf-scanner, Ethereal Exchange workspace
  channel_name: "#etf-scanner"
  levels: [SIGNAL]                   # add WATCH to also post new near-misses

# ---------------------------------------------------------------- universe
# underlying = what gets scanned.
# bull = leveraged funds (TICKER: leverage) to look at on a bullish setup.
# bear = inverse leveraged funds (TICKER: -leverage) to look at on a bearish setup.
# Verify with your broker: issuers occasionally change a fund's leverage,
# close it, rename it or reverse-split it.
#
# scan_targets: underlying | leveraged | both
#   underlying is usually cleanest (more liquid, no decay noise in the chart).
scan_targets: underlying

universe:
